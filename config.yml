# ==========================================================================
# config.yml - CHI CAN thong tin xac thuc cho tung thiet bi.
# Luong dang nhap (nhap password -> chon "4" vao Device Console) va bo
# metric mac dinh (fgSysSesCount, fgSysSesRate1, fgSysVersionAv,
# fgSysVersionIps kieu tuong duong) da duoc hard-code san trong app.py.
# ==========================================================================

targets:
  - name: fw1
    host: 192.168.1.1
    port: 22
    username: admin
    password: "CHANGE_ME"
    poll_interval: 30        # so giay giua 2 lan poll

  - name: fw2
    host: 192.168.2.1
    port: 22
    username: admin
    password: "CHANGE_ME"
    poll_interval: 30

  # them bao nhieu thiet bi tuy y, chi can host/username/password.
  # - name: fw3
  #   host: 192.168.3.1
  #   username: admin
  #   password: "CHANGE_ME"

